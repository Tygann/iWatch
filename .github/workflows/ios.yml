name: iOS verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      simulator: ${{ steps.changes.outputs.simulator }}
      unit-tests: ${{ steps.changes.outputs.unit-tests }}
      ui-selection: ${{ steps.changes.outputs.ui-selection }}
    steps:
      - name: Start preflight timer
        run: echo "PREFLIGHT_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed secrets
        run: |
          test ! -f iWatch/Secrets.plist
          ! git grep -nE '(TRAKT_CLIENT_SECRET|TMDB_API_KEY).*[=:][[:space:]]*[A-Za-z0-9_-]{24,}' -- ':!iWatch/Secrets.example.plist'
      - name: Test simulator routing
        run: python3 scripts/test-ios-test-selection.py
      - name: Check whitespace and select simulator tests
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BASE_SHA" ] && [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base=$(git hash-object -t tree /dev/null)
          else
            base=HEAD
          fi
          git diff --check "$base" HEAD
          options=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
            options+=(--full-ui)
          fi
          python3 scripts/select-ios-tests.py "$base" HEAD --outputs "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY" "${options[@]}"
      - name: Check UI architecture boundaries
        run: python3 scripts/check-view-boundaries.py
      - name: Check Trakt configuration validation
        run: python3 scripts/test-trakt-configuration.py
      - name: Check CloudKit schema preflight
        run: python3 scripts/check-cloudkit-schema.py --self-test

      - name: Report preflight duration
        if: always() && env.PREFLIGHT_START != ''
        run: |
          elapsed=$(( $(date +%s) - PREFLIGHT_START ))
          printf '### Linux preflight\n\n**%s** · %d min %02d s\n\n' "${{ job.status }}" "$((elapsed / 60))" "$((elapsed % 60))" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: preflight
    if: needs.preflight.outputs.simulator == 'true'
    runs-on: xcode-27
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.2
    steps:
      - uses: actions/checkout@v4
      - name: Build for testing
        id: build
        run: >-
          bash scripts/time-ios-stage.sh "Build for testing" xcodebuild build-for-testing -project iWatch.xcodeproj -scheme iWatch
          -destination "$SIMULATOR_DESTINATION"
          -derivedDataPath work/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Unit tests
        if: needs.preflight.outputs.unit-tests == 'true'
        run: >-
          bash scripts/time-ios-stage.sh "Unit tests" xcodebuild test-without-building -project iWatch.xcodeproj -scheme iWatch
          -destination "$SIMULATOR_DESTINATION" -derivedDataPath work/DerivedData
          -only-testing:iWatchTests -parallel-testing-enabled NO
          -resultBundlePath work/iWatchTests.xcresult
      - name: UI tests
        if: "!cancelled() && steps.build.outcome == 'success' && needs.preflight.outputs.ui-selection != ''"
        env:
          UI_SELECTION: ${{ needs.preflight.outputs.ui-selection }}
        run: |
          read -r -a tests <<< "$UI_SELECTION"
          arguments=()
          for test in "${tests[@]}"; do
            arguments+=("-only-testing:$test")
          done
          bash scripts/time-ios-stage.sh "UI tests (including simulator setup)" xcodebuild test-without-building -project iWatch.xcodeproj -scheme iWatch \
            -destination "$SIMULATOR_DESTINATION" -derivedDataPath work/DerivedData \
            "${arguments[@]}" -parallel-testing-enabled NO -resultBundlePath work/iWatchUITests.xcresult
      - name: Save test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iwatch-test-results
          path: |
            work/iWatchTests.xcresult
            work/iWatchUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7

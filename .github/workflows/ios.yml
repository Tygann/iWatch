name: iOS verification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed secrets
        run: |
          test ! -f iWatch/Secrets.plist
          ! git grep -nE '(TRAKT_CLIENT_SECRET|TMDB_API_KEY).*[=:][[:space:]]*[A-Za-z0-9_-]{24,}' -- ':!iWatch/Secrets.example.plist'
      - name: Check whitespace and detect notification changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
          elif [ -n "$PUSH_BASE_SHA" ] && [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BASE_SHA"
          else
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$base" HEAD
          notification_changes=$(git diff --name-only "$base" HEAD -- \
            .github/workflows/ios.yml iWatch.xcodeproj \
            iWatch/App iWatch/iWatchApp.swift iWatch/Features/Settings \
            iWatch/Platform/Notifications iWatchUITests)
          if [ -n "$notification_changes" ]; then
            echo "notifications=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check UI architecture boundaries
        run: python3 scripts/check-view-boundaries.py
      - name: Check Trakt configuration validation
        run: python3 scripts/test-trakt-configuration.py
      - name: Check CloudKit schema preflight
        run: python3 scripts/check-cloudkit-schema.py --self-test
      - name: Build for testing
        run: >-
          xcodebuild build-for-testing -project iWatch.xcodeproj -scheme iWatch
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -derivedDataPath work/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Unit tests
        run: >-
          xcodebuild test-without-building -project iWatch.xcodeproj -scheme iWatch
          -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath work/DerivedData
          -only-testing:iWatchTests -parallel-testing-enabled NO
          -resultBundlePath work/iWatchTests.xcresult
      - name: Notification settings UI tests
        if: steps.changes.outputs.notifications == 'true'
        run: |
          xcodebuild test-without-building -project iWatch.xcodeproj -scheme iWatch \
            -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath work/DerivedData \
            -only-testing:iWatchUITests/iWatchUITests/testNotificationSettingsAtStandardTextSize \
            -only-testing:iWatchUITests/iWatchUITests/testNotificationSettingsAtAccessibilityTextSize \
            -parallel-testing-enabled NO -resultBundlePath work/iWatchNotificationUITests.xcresult
      - name: Save test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iwatch-test-results
          path: |
            work/iWatchTests.xcresult
            work/iWatchNotificationUITests.xcresult
          retention-days: 7
